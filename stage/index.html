<!doctype html><html><head><meta charset="utf-8"><title>Hubie stage</title>
<meta name="viewport" content="width=1280">
<style>
:root{--gold:#e9b44c;--mint:#7ae0cf;--ink:#f4fbfa}
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000;color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#000}
/* the whole frame is the game (the Housebets browser window) */
#game{position:absolute;inset:0}
#game canvas{display:block;width:1280px;height:720px}
/* Hubie: a cut-out, no background, standing in the corner like a face-cam */
#hubie{z-index:5;position:absolute;right:0;bottom:26px;width:195px;height:172px;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));pointer-events:none}
/* chat floats over the picture: plain text, no panel */
#chat{z-index:6;position:absolute;left:16px;bottom:96px;width:330px;max-height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;font-size:19px;line-height:1.22;text-align:left}
#chat .msg{text-shadow:0 1px 3px #000,0 0 8px #000,0 0 2px #000;word-break:break-word;transition:opacity .6s}
#chat .u{font-weight:800;margin-right:6px}
/* what Hubie is saying: outlined text, no box */
#caption{position:absolute;left:480px;right:300px;top:100px;text-align:center;font-size:27px;line-height:1.2;font-weight:700;color:#fff;text-shadow:0 2px 4px #000,0 0 10px #000,0 0 3px #000;opacity:0;transition:opacity .25s}
#caption.on{opacity:1}
#caption{display:none!important}
/* small, always-on responsible-gambling strip */
#banner{z-index:6;position:absolute;left:0;bottom:0;width:1280px;height:24px;display:flex;align-items:center;justify-content:center;gap:16px;background:#000b;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
#banner span.dot{color:#7a6a3a}
#chip{position:absolute;left:14px;top:12px;padding:5px 12px;border-radius:999px;background:#000a;font-size:14px;font-weight:700;color:var(--mint);letter-spacing:.04em;display:none}
#vote{position:absolute;right:16px;top:12px;width:300px;display:none;text-shadow:0 1px 3px #000}
#vote h4{margin:0 0 6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#cfe}
#vote .row{position:relative;height:24px;margin:4px 0;border-radius:6px;background:#0009;overflow:hidden}
#vote .bar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1b7f8f,#2fb5a5);width:0%;transition:width .4s}
#vote .lab{position:relative;z-index:1;display:flex;justify-content:space-between;padding:3px 10px;font-size:13px;font-weight:700}
#break{z-index:3;position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000c;font-size:44px;font-weight:800;text-align:center;padding:0 160px;text-shadow:0 2px 8px #000}
#cursor{position:absolute;left:0;top:0;width:26px;height:26px;pointer-events:none;display:none;transition:transform .32s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 2px 3px #000a);z-index:20}
#ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #7ae0cf;pointer-events:none;opacity:0;z-index:19}
#ripple.go{animation:rip .55s ease-out}
@keyframes rip{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}
#standin{position:absolute;right:14px;top:12px;font-size:11px;color:#fff;opacity:.55;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 2px #000}
</style></head><body>
<div id="stage">
  <div id="game"><canvas id="arena" width="1920" height="1080"></canvas></div>
  <div id="chip"></div><div id="standin" style="display:none">pipeline test scene</div>
  <div id="vote"><h4>Vote the next game</h4><div id="voterows"></div></div>
  <canvas id="hubie" width="940" height="826"></canvas>
  <div id="ripple"></div><svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 18 L7.5 14 L10.5 21 L13.2 19.8 L10.3 13 L16 13 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="break"></div>
  <div id="chat"></div>
  <div id="caption"></div>
  <div id="banner"><span>Demo play only</span><span class="dot">•</span><span>No real money</span><span class="dot">•</span><span>18+</span><span class="dot">•</span><span>Play responsibly</span></div>
</div>
<script src="../rig/lip.js"></script>
<script src="../rig/hubie.js"></script>
<script src="arena.js"></script>
<script src="stage.js"></script>
</body></html>
