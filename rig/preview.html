<!doctype html><html><head><meta charset="utf-8"><title>Hubie preview render</title>
<style>body{margin:0;background:#071318;color:#cde;font:14px system-ui}canvas{width:660px;display:block}</style></head><body>
<canvas id="c" width="990" height="870"></canvas><div id="s">loading</div>
<script src="lip.js"></script>
<script src="hubie.js"></script>
<script>
const FPS=30, SERVER='http://127.0.0.1:8766';
const SET=new URLSearchParams(location.search).get('set')||'demo';   // demo = macOS voice (estimated timing), demo_el = ElevenLabs (exact timing)
const bg=(ctx,w,h)=>{const g=ctx.createRadialGradient(w*.5,h*.35,40,w*.5,h*.5,h*.9);g.addColorStop(0,'#15505a');g.addColorStop(1,'#061317');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);};
const canvas=document.getElementById('c');
const h=new Hubie(canvas,{background:bg});h.manualDt=true;
const status=t=>document.getElementById('s').textContent=t;
const toBlob=()=>new Promise(r=>canvas.toBlob(r,'image/jpeg',0.92));
async function run(){
  while(!h.ready)await new Promise(r=>setTimeout(r,100));
  const lines=await (await fetch('demo/lines.json')).json();
  const dec=new OfflineAudioContext(1,1,44100);
  let frame=0;const meta=[];
  const emit=async()=>{h.render();await fetch(SERVER+'/frame?i='+frame,{method:'POST',body:await toBlob()});frame++;};
  const idle=async(sec,emo)=>{h.setEmotion(emo||'smug');for(let i=0;i<Math.round(sec*FPS);i++){h.step(1/FPS);await emit();}};
  await idle(1.0,'smug');
  for(const L of lines){
    const ext=SET==='demo'?'.wav':'.mp3';
    const ab=await (await fetch(SET+'/'+L.id+ext)).arrayBuffer();
    const buf=await dec.decodeAudioData(ab);
    let al=null;if(SET!=='demo'){try{al=await (await fetch(SET+'/'+L.id+'.json')).json();}catch(e){}}
    const utt=await h.prepare({decode:buf,text:L.text,emotion:L.emotion,alignment:al});
    meta.push({id:L.id,start:frame/FPS,dur:utt.dur,segs:utt.tl.length,estimated:utt.estimated});
    status('line '+L.id+' segs '+utt.tl.length);
    h.say(utt,{offline:true});
    const n=Math.ceil((utt.dur+0.3)*FPS);
    for(let i=0;i<n;i++){h.step(1/FPS);await emit();}
    await idle(0.7,L.emotion==='sad'?'smug':L.emotion);
  }
  await fetch(SERVER+'/meta',{method:'POST',body:JSON.stringify({fps:FPS,frames:frame,lines:meta})});
  status('DONE '+frame);window.DONE=true;
}
run().catch(e=>{status('ERR '+e);window.ERR=String(e);});
</script></body></html>
