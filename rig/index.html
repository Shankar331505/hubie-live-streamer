<!doctype html><html><head><meta charset="utf-8"><title>Hubie rig test</title>
<style>
:root{--bg:#0b1c22;--fg:#e8f4f2;--ac:#e9b44c}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
canvas{background:radial-gradient(circle at 50% 30%,#14464f,#071318);width:min(100vw,1100px);max-width:100%;aspect-ratio:16/9;display:block}
#ui{display:flex;flex-wrap:wrap;gap:6px;padding:10px;max-width:1100px;justify-content:center}
button{background:#12323a;color:var(--fg);border:1px solid #28555f;border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:#1b4650}
label{display:flex;align-items:center;gap:6px}
</style></head><body>
<canvas id="c" width="1376" height="768"></canvas>
<div id="ui"></div>
<script src="rig.js"></script>
<script>
const h=new Hubie(document.getElementById('c'));window.h=h;
const ui=document.getElementById('ui');
const add=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;ui.appendChild(b);};
for(const g of Object.keys(HUBIE_GESTURES))add(g,()=>h.play(g));
add('point L→game',()=>h.play('point',{side:'L',target:[250,260]}));
add('point R→chat',()=>h.play('point',{side:'R',target:[1150,330]}));
['smug','happy','sad','shock','laugh','sleepy','hype'].forEach(m=>add('mood:'+m,()=>h.setMood(m)));
['left','right','wide','open'].forEach(m=>add('eyes:'+m,()=>h.look(m,1.5)));
const lab=document.createElement('label');lab.innerHTML='voice level <input id="lv" type="range" min="0" max="100" value="0">';ui.appendChild(lab);
document.getElementById('lv').oninput=e=>h.setMouthLevel(e.target.value/100);
let talk=null;add('simulate talking',()=>{if(talk){clearInterval(talk);talk=null;h.setMouthLevel(0);return;}talk=setInterval(()=>h.setMouthLevel(Math.random()<.2?0:Math.random()),90);});
let auto=null;add('auto show',()=>{if(auto){clearInterval(auto);auto=null;return;}
 const names=Object.keys(HUBIE_GESTURES).filter(n=>n!=='reset');
 auto=setInterval(()=>{if(h.isBusy())return;const n=names[Math.floor(Math.random()*names.length)];
  if(n==='point')h.play('point',{side:Math.random()<.5?'L':'R',target:[200+Math.random()*900,150+Math.random()*300]});else h.play(n,{side:Math.random()<.5?'L':'R'});},800);});
</script></body></html>
